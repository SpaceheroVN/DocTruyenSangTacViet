<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Releases — Đọc Truyện STV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --bg:        #0c0b15;
      --surface:   #13121e;
      --surface2:  #1c1b2e;
      --surface3:  #232237;
      --border:    #2a2840;
      --border2:   #343259;
      --accent:    #e8a045;
      --accent2:   #c45c8a;
      --text:      #eae8f2;
      --text-sub:  #a09dc0;
      --text-muted:#5e5c7a;
      --green:     #4cca96;
      --danger:    #e05c6e;
      --r:         12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 14px;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 15% 10%, rgba(232,160,69,.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 85% 80%, rgba(196,92,138,.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* HEADER */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(12,11,21,.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px 0;
    }
    .logo-ring {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #c47820);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(232,160,69,.28);
    }
    .logo-ring svg { color: #0c0b15; }
    .header-title { flex: 1; min-width: 0; }
    .header-title h1 {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-title p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .header-github {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500; color: var(--text-sub);
      text-decoration: none;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px;
      transition: all .2s; flex-shrink: 0;
    }
    .header-github:hover { border-color: var(--accent); color: var(--accent); }
    .header-tabs { display: flex; padding: 0 12px; gap: 0; margin-top: 4px; }
    .htab {
      padding: 8px 12px; font-size: 12px; font-weight: 500;
      color: var(--text-muted); border-bottom: 2px solid transparent;
      cursor: pointer; transition: color .2s; text-decoration: none;
    }
    .htab.active { color: var(--text); border-bottom-color: var(--accent); }
    .htab:hover:not(.active) { color: var(--text-sub); }

    /* MAIN */
    main {
      position: relative; z-index: 1;
      max-width: 680px; margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* LOADING */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 60px 0;
      color: var(--text-muted); font-size: 13px;
    }
    .spinner {
      width: 30px; height: 30px;
      border: 2px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR */
    .error-box {
      background: rgba(224,92,110,.08);
      border: 1px solid rgba(224,92,110,.3);
      border-radius: var(--r); padding: 20px;
      text-align: center; color: var(--danger); font-size: 13px;
    }

    /* RELEASE CARD */
    .release-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 14px; overflow: hidden;
      transition: border-color .25s, box-shadow .25s;
      animation: slideUp .35s ease both;
    }
    .release-card:hover { border-color: var(--border2); }
    .release-card.latest {
      border-color: rgba(232,160,69,.28);
      box-shadow: 0 0 0 1px rgba(232,160,69,.06);
    }
    .release-card.latest:hover { border-color: rgba(232,160,69,.5); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .release-card:nth-child(1) { animation-delay:.05s }
    .release-card:nth-child(2) { animation-delay:.13s }
    .release-card:nth-child(3) { animation-delay:.21s }
    .release-card:nth-child(n+4) { animation-delay:.28s }

    /* CARD HEAD */
    .card-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; cursor: pointer;
      user-select: none; -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .card-head:active { background: rgba(255,255,255,.025); }
    .version-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--border2); flex-shrink: 0;
      transition: background .2s, box-shadow .2s;
    }
    .release-card.latest .version-dot {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(232,160,69,.55);
    }
    .release-card.open:not(.latest) .version-dot { background: var(--accent2); }

    .card-head-info { flex: 1; min-width: 0; }
    .card-version-row {
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    }
    .card-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .badge {
      font-size: 9px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
    }
    .badge-latest { background: rgba(76,202,150,.12); color: var(--green); border: 1px solid rgba(76,202,150,.3); }
    .badge-first  { background: rgba(196,92,138,.12); color: var(--accent2); border: 1px solid rgba(196,92,138,.3); }
    .card-date { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; color: var(--text-muted);
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px; margin-top: 4px;
    }
    .chevron {
      color: var(--text-muted);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      flex-shrink: 0;
    }
    .release-card.open .chevron { transform: rotate(180deg); }

    /* CARD BODY */
    .card-body { max-height: 0; overflow: hidden; transition: max-height .42s cubic-bezier(.4,0,.2,1); }
    .release-card.open .card-body { max-height: 9999px; }
    .card-body-inner { border-top: 1px solid var(--border); }

    /* DOWNLOAD STRIP */
    .download-strip {
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: var(--surface2); border-bottom: 1px solid var(--border);
    }
    .btn-dl {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: #0c0b15;
      background: var(--accent); border-radius: 8px;
      padding: 7px 14px; text-decoration: none;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 2px 12px rgba(232,160,69,.22);
    }
    .btn-dl:active { opacity: .85; transform: scale(.97); }
    .btn-src {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-sub); text-decoration: none;
      border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 10px; transition: all .2s;
    }
    .btn-src:hover { border-color: var(--border2); color: var(--text); }

    /* MARKDOWN */
    .md-content {
      padding: 20px 18px 22px;
      font-size: 13px; color: #c5c2dc; line-height: 1.72;
    }
    .md-content h2 {
      font-size: 11px; font-weight: 700; color: var(--accent2);
      text-transform: uppercase; letter-spacing: .8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 7px; margin: 24px 0 12px;
    }
    .md-content h2:first-child { margin-top: 0; }
    .md-content h3 {
      font-size: 13px; font-weight: 600; color: var(--green);
      margin: 16px 0 8px;
      display: flex; align-items: center; gap: 7px;
    }
    .md-content h3::before {
      content: ''; width: 3px; height: 12px;
      background: var(--green); border-radius: 2px;
      display: inline-block; flex-shrink: 0;
    }
    .md-content ul { list-style: none; display: flex; flex-direction: column; gap: 6px; padding: 0; }
    .md-content li { display: flex; gap: 8px; }
    .md-content li::before { content: '–'; color: var(--text-muted); flex-shrink: 0; }
    .md-content li > ul { margin-top: 6px; padding-left: 8px; }
    .md-content li > ul > li::before { content: '◦'; }
    .md-content strong { color: var(--text); font-weight: 600; }
    .md-content em { color: var(--text-sub); font-style: italic; }
    .md-content code {
      font-family: 'SFMono-Regular', 'Menlo', monospace; font-size: 11px;
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; color: var(--accent);
    }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .md-content p { margin-bottom: 10px; }
    .md-content p:last-child { margin-bottom: 0; }

    /* FOOTER */
    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 22px 16px;
      font-size: 11px; color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @supports (padding: max(0px)) {
      main { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo-ring">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
    <div class="header-title">
      <h1>Đọc Truyện STV</h1>
      <p>SpaceheroVN / DocTruyenSangTacViet</p>
    </div>
    <a class="header-github" href="https://github.com/SpaceheroVN/DocTruyenSangTacViet" target="_blank">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
      GitHub
    </a>
  </div>
  <div class="header-tabs">
    <a class="htab active" href="#">Releases</a>
    <a class="htab" href="https://github.com/SpaceheroVN/DocTruyenSangTacViet/tags" target="_blank">Tags</a>
  </div>
</header>

<main id="releases-list">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Đang tải danh sách phiên bản...</span>
  </div>
</main>

<footer>
  <p>Tự động cập nhật từ <a href="https://github.com/SpaceheroVN/DocTruyenSangTacViet/releases" target="_blank">GitHub Releases</a> · © 2026 SpaceheroVN</p>
</footer>

<script>
const REPO = 'SpaceheroVN/DocTruyenSangTacViet';
const API  = `https://api.github.com/repos/${REPO}/releases`;

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('vi-VN', { day: '2-digit', month: 'long', year: 'numeric' });
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dlUrl(tag, assets) {
  const rar = assets.find(a => a.name.endsWith('.rar'));
  return rar
    ? { url: rar.browser_download_url, name: rar.name, size: Math.round(rar.size/1024) + ' KB' }
    : { url: `https://github.com/${REPO}/releases/download/${tag}/DocTruyenSTV.rar`, name: 'DocTruyenSTV.rar', size: '' };
}

function buildCard(release, index) {
  const isLatest = index === 0;
  const tag   = release.tag_name;
  const name  = release.name || tag;
  const date  = fmtDate(release.published_at);
  const dl    = dlUrl(tag, release.assets || []);
  const body  = release.body || '';
  const isFirst = tag.includes('0.1') || release.prerelease === false && index === (/* filled later */0);

  const card = document.createElement('div');
  card.className = 'release-card' + (isLatest ? ' latest open' : '');

  // Detect first release heuristically
  const firstBadge = !isLatest ? `<span class="badge badge-first">Phiên bản đầu</span>` : '';

  card.innerHTML = `
    <div class="card-head" role="button" aria-expanded="${isLatest}">
      <div class="version-dot"></div>
      <div class="card-head-info">
        <div class="card-version-row">
          <span class="card-title">${esc(name)}</span>
          ${isLatest ? '<span class="badge badge-latest">Latest</span>' : firstBadge}
        </div>
        <div class="card-date">${date}</div>
        <div class="tag-pill">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          ${esc(tag)}
        </div>
      </div>
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="card-body">
      <div class="card-body-inner">
        <div class="download-strip">
          <a class="btn-dl" href="${esc(dl.url)}" target="_blank">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            ${esc(dl.name)}${dl.size ? ' <span style="opacity:.55;font-weight:400;font-size:11px">· '+dl.size+'</span>' : ''}
          </a>
          <a class="btn-src" href="https://github.com/${REPO}/archive/refs/tags/${esc(tag)}.zip" target="_blank">zip</a>
          <a class="btn-src" href="https://github.com/${REPO}/archive/refs/tags/${esc(tag)}.tar.gz" target="_blank">tar.gz</a>
        </div>
        <div class="md-content">${marked.parse(body)}</div>
      </div>
    </div>
  `;

  card.querySelector('.card-head').addEventListener('click', () => {
    const open = card.classList.toggle('open');
    card.querySelector('.card-head').setAttribute('aria-expanded', String(open));
  });

  return card;
}

async function loadReleases() {
  const list = document.getElementById('releases-list');
  try {
    const res = await fetch(API, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`GitHub API trả về ${res.status}`);
    const releases = await res.json();

    list.innerHTML = '';
    if (!releases.length) {
      list.innerHTML = '<div class="error-box">Chưa có phiên bản nào được phát hành.</div>';
      return;
    }

    // Mark last item as "first release"
    releases.forEach((r, i) => {
      const card = buildCard(r, i);
      if (i === releases.length - 1) {
        // last = oldest = first release
        const row = card.querySelector('.card-version-row');
        if (!row.querySelector('.badge')) {
          const b = document.createElement('span');
          b.className = 'badge badge-first';
          b.textContent = 'Phiên bản đầu';
          row.appendChild(b);
        }
      }
      list.appendChild(card);
    });
  } catch (err) {
    list.innerHTML = `
      <div class="error-box">
        <p style="margin-bottom:8px;font-weight:600;">Không thể tải dữ liệu từ GitHub</p>
        <p style="font-size:12px;opacity:.75;">${esc(err.message)}</p>
        <p style="font-size:12px;margin-top:10px;opacity:.7;">
          Xem trực tiếp tại
          <a href="https://github.com/${REPO}/releases" target="_blank"
            style="color:var(--accent);text-decoration:none;">github.com/${REPO}/releases</a>
        </p>
      </div>`;
  }
}

loadReleases();
</script>
</body>
</html>
